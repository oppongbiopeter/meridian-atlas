* { box-sizing:border-box; }

button { font:inherit; color:inherit; cursor:pointer; }
.wrap { display:grid; grid-template-rows:auto 1fr; height:100%; }
header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.brand { font-family:Fraunces,serif; font-size:1.15rem; letter-spacing:-.02em; }
.brand small { display:block; font-family:"IBM Plex Sans",sans-serif; font-size:.62rem; letter-spacing:.16em; color:var(--muted); text-transform:uppercase; }
select, input { background:#191d24; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
input { min-width:12rem; flex:1; }
.btn { background:#191d24; border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
.btn.on { background:var(--fg); color:var(--bg); }
.stage { display:grid; grid-template-columns:1fr minmax(280px, 22rem); min-height:0; }

.map { position:relative; background:var(--ocean); min-height:0; }
.globe-host { position:absolute; inset:0; z-index:0; }
svg { width:100%; height:100%; display:block; position:relative; z-index:0; }
.land { stroke:rgba(9,11,14,.45); stroke-width:.4; cursor:pointer; }
.land:hover { stroke:#fff; stroke-width:1.1; }
.land.sel { stroke:#fff; stroke-width:1.4; }
.land.pulse { animation:pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { fill:#fff3b0; } }
.graticule { fill:none; stroke:rgba(236,239,243,.055); }
.sphere { fill:none; stroke:rgba(236,239,243,.16); }
.rail { position:absolute; left:12px; right:12px; top:12px; display:flex; gap:6px; overflow:auto; pointer-events:none; z-index:8; }
.rail button { pointer-events:auto; white-space:nowrap; font-size:.72rem; }
.tip { position:absolute; left:12px; top:48px; max-width:18rem; background:var(--card); border-radius:12px; padding:10px 12px; box-shadow:0 0 0 1px var(--line); font-size:.8rem; z-index:8; }
.tip h4 { margin:0 0 4px; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:500; }
.legend { position:absolute; right:12px; bottom:12px; background:var(--card); padding:8px 10px; border-radius:10px; font-size:.7rem; color:var(--muted); z-index:8; }
.swatches { display:flex; height:8px; width:140px; border-radius:99px; overflow:hidden; margin:6px 0; }
.swatches i { flex:1; }
.tt { position:fixed; pointer-events:none; background:#161a21; padding:6px 8px; border-radius:8px; font-size:.75rem; box-shadow:0 0 0 1px var(--line); z-index:20; }
aside { background:var(--card); border-left:1px solid var(--line); overflow:auto; padding:16px; }
h2 { font-family:Fraunces,serif; font-weight:500; margin:0 0 4px; font-size:1.45rem; }
.muted { color:var(--muted); font-size:.8rem; }
.stat { font-family:Fraunces,serif; font-size:1.8rem; margin:8px 0 2px; }
.row { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:.82rem; }
.pics { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:10px; }
.pics img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; display:block; }
.pics button { padding:0; border:2px solid transparent; background:none; border-radius:10px; }
.pics button.on { border-color:var(--fg); }
.word { display:flex; gap:12px; align-items:center; margin-bottom:12px; }
.word img { width:80px; height:80px; object-fit:cover; border-radius:12px; }
.local { display:inline-flex; align-items:center; gap:6px; margin-top:6px; background:#191d24; border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:.9rem; }
.search-list { position:absolute; top:52px; left:180px; z-index:30; background:#161a21; border-radius:10px; min-width:16rem; max-height:16rem; overflow:auto; box-shadow:0 0 0 1px var(--line); }
.search-list button { display:block; width:100%; text-align:left; background:none; border:0; padding:8px 10px; font-size:.82rem; }
.search-list button:hover { background:#1e242e; }
.quiz { position:absolute; left:12px; top:12px; width:min(22rem, calc(100% - 24px)); background:var(--card); border-radius:16px; padding:12px; z-index:15; box-shadow:0 18px 40px -24px #000; }
.quiz h3 { margin:0 0 8px; font-family:Fraunces,serif; font-weight:500; }
.hide { display:none !important; }
.lives { letter-spacing:.2em; }
</style>

  if (m.format === "percent") return (m.decimals ? n.toFixed(m.decimals) : Math.round(n)) + "%";
  if (m.format === "years") return n.toFixed(m.decimals || 1) + " yr";
  if (abs >= 1e9) return (n/1e9).toFixed(1).replace(/\.0$/,"") + "B";
  if (abs >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"") + "M";
  if (abs >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,"") + "K";
  return m.decimals ? n.toFixed(m.decimals) : String(Math.round(n));
}
function valuesFor(id) {
  return DATA.countries.map(c => c.values[id]).filter(v => v != null && isFinite(v));
}
function locked() {
  const m = metricDef(state.metric);
  return state.mode !== "kids" && m.tier === "plus" && !state.plus;
}
function colorOf(v, id) {
  if (locked()) return emptyFill();
  if (v == null) return emptyFill();
  const m = metricDef(id);
  const vals = valuesFor(id).slice().sort((a,b)=>a-b);
  if (!vals.length) return emptyFill();
  let x = v;
  const stops = ramp();
  if (m.scale === "log") {
    const pos = vals.filter(n => n > 0);
    if (!pos.length || v <= 0) return stops[0];
    const min = Math.log(pos[0]), max = Math.log(pos[pos.length-1]);
    x = (Math.log(v) - min) / (max - min || 1);
  } else {
    const min = vals[0], max = vals[vals.length-1];
    x = (v - min) / (max - min || 1);
  }
  const i = Math.max(0, Math.min(4, Math.floor(x * 4.999)));
  return stops[i];
}

function speak(text, locale, rate) {
  if (!window.speechSynthesis || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = locale || "en-US";
  u.rate = rate || 0.86;
  const voices = speechSynthesis.getVoices();
  const want = (locale || "en").slice(0,2).toLowerCase();
  const v = voices.find(x => x.lang.toLowerCase().startsWith(want));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function speechFor(iso3) {
  const key = ISO3_LANG[iso3] || "en";
  const row = LANG[key] || LANG.en;
  return { locale: row.locale, lang: key, language: row.language };
}
function localWord(metricId, iso3) {
  const info = speechFor(iso3);
  const table = I18N[metricId] || {};
  return table[info.lang] || table.en || null;
}

const svg = d3.select("#map").append("svg");
const g = svg.append("g");
const path = d3.geoPath();
let features = [];
let globe = null;
let globeDrag = false;

function oceanUrl() {
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 512;
  const ctx = c.getContext("2d");
  const gr = ctx.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, "#14202c");
  gr.addColorStop(0.5, "#0c1016");
  gr.addColorStop(1, "#141820");
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, 1024, 512);
  return c.toDataURL("image/png");
}
function fillId(id) {
  if (state.quiz && state.quiz.phase === "play" && !state.quiz.verdict) return emptyFill();
  const rec = byId.get(id);
  return rec ? colorOf(rec.values[state.metric], state.metric) : emptyFill();
}
function mapSize() {
  const el = document.getElementById("map");
  return { width: el.clientWidth || 800, height: el.clientHeight || 500 };
}
function ensureGlobe() {
  if (globe) return globe;
  const host = document.getElementById("globeHost");
  globe = Globe()(host)
    .backgroundColor("rgba(0,0,0,0)")
    .globeImageUrl(oceanUrl())
    .atmosphereColor("#3b8880")
    .atmosphereAltitude(0.16)
    .polygonsData(features)
    .polygonCapColor(d => fillId(d.id))
    .polygonSideColor(() => "rgba(12,16,22,0.9)")
    .polygonStrokeColor(() => "rgba(9,11,14,0.55)")
    .polygonAltitude(d => d.id === state.selected ? 0.016 : 0.006)
    .polygonsTransitionDuration(180)
    .onPolygonHover((d, ev) => {
      const tt = document.getElementById("tt");
      if (!d) { tt.classList.add("hide"); return; }
      const rec = byId.get(d.id);
      const name = rec ? rec.name : (d.properties && d.properties.name) || "";
      const showName = !(state.quiz && state.quiz.level && !state.quiz.level.showNames && state.quiz.phase==="play");
      const m = metricDef(state.metric);
      const val = rec ? rec.values[state.metric] : null;
      tt.classList.remove("hide");
      if (ev) { tt.style.left = (ev.clientX + 12) + "px"; tt.style.top = (ev.clientY + 12) + "px"; }
      tt.textContent = (showName ? name : "???") + (val == null || locked() ? "" : " · " + fmt(val, m));
    })
    .onPolygonClick(d => { if (!globeDrag) onCountry(d.id); });
  host.addEventListener("pointerdown", () => { globeDrag = false; });
  host.addEventListener("pointermove", e => { if (e.buttons) globeDrag = true; });
  return globe;
}

function projection() {
  const {width, height} = mapSize();
  return d3.geoEqualEarth()
    .fitExtent([[16,28],[width-16,height-16]], {type:"Sphere"})
    .precision(0.3);
}

function draw() {
  const {width, height} = mapSize();
  const globeOn = state.view === "globe";
  document.getElementById("globeHost").classList.toggle("hide", !globeOn);
  svg.style("display", globeOn ? "none" : "block");
  if (globeOn) {
    const g3 = ensureGlobe();
    g3.width(width).height(height)
      .atmosphereColor(state.mode === "kids" ? "#f0c14a" : "#3b8880")
      .atmosphereAltitude(state.mode === "kids" ? 0.22 : 0.16)
      .polygonCapColor(d => {
        if (state.quiz && state.quiz.pulse === d.id) return state.quiz.verdict === "no" ? "#b4554a" : "#d5f0e8";
        return fillId(d.id);
      })
      .polygonAltitude(d => {
        if (state.quiz && state.quiz.pulse === d.id) return 0.028;
        if (d.id === state.selected) return 0.016;
        return 0.006;
      });
    return;
  }
  svg.attr("viewBox", `0 0 ${width} ${height}`);
  const proj = projection();
  path.projection(proj);
  g.selectAll("*").remove();
  g.append("path").datum(d3.geoGraticule10()).attr("d", path).attr("class","graticule");
  g.append("path").datum({type:"Sphere"}).attr("d", path).attr("class","sphere");
  g.selectAll("path.land").data(features).join("path")
    .attr("class", d => {
      let c = "land";
      if (state.selected && d.id === state.selected) c += " sel";
      if (state.quiz && state.quiz.pulse === d.id) c += " pulse";
      return c;
    })
    .attr("fill", d => fillId(d.id))
    .attr("d", path)
    .on("pointermove", (ev, d) => {
      const rec = byId.get(d.id);
      const name = rec ? rec.name : d.properties.name;
      const showName = !(state.quiz && state.quiz.level && !state.quiz.level.showNames && state.quiz.phase==="play");
      const m = metricDef(state.metric);
      const val = rec ? rec.values[state.metric] : null;
      const tt = document.getElementById("tt");
      tt.classList.remove("hide");
      tt.style.left = (ev.clientX + 12) + "px";
      tt.style.top = (ev.clientY + 12) + "px";
      tt.textContent = (showName ? name : "???") + (val == null || locked() ? "" : " · " + fmt(val, m));
    })
    .on("pointerleave", () => document.getElementById("tt").classList.add("hide"))
    .on("click", (ev, d) => onCountry(d.id));
}

      <button class="btn" id="qSpeak">🔊</button>
    </div>
    <p>Find ${q.word} on the globe.</p>
    ${qz.level.showHint ? `<p class="muted">${q.hint}</p>` : ""}
    <div id="qVerdict"></div>`;
  document.getElementById("quizClose").onclick = closeQuiz;
  const say = () => { speak(q.word, "en-US", 0.76); setTimeout(() => speak("Find " + q.word + ". Spin the globe and tap it.", "en-US", 0.9), 700); };
  document.getElementById("qSpeak").onclick = say;
  document.getElementById("qPic").onclick = say;
  say();
}
function quizTap(id) {
  const qz = state.quiz;
  if (!qz || qz.verdict) return;
  const q = qz.questions[qz.index];
  const box = document.getElementById("qVerdict");
  if (id === q.id) {
    qz.verdict = "yes"; qz.score++; qz.pulse = id;
    const rec = byId.get(id);
    const loc = localWord(q.pic, rec.iso3);
    const info = speechFor(rec.iso3);
    box.innerHTML = `<p>Yes — ${q.name}.</p>` +
      (loc ? `<button class="local" type="button" id="qLocal">${loc} · ${info.lang.toUpperCase()} 🔊</button>` : "");
    speak("Yes. " + q.name, "en-US", 0.9);
    const locBtn = document.getElementById("qLocal");
    if (locBtn) locBtn.onclick = () => speak(loc, info.locale, 0.78);
    draw();
    setTimeout(nextQuestion, 1600);
  } else {
    qz.lives -= 1;
    box.innerHTML = `<p class="muted">Not that one. Keep spinning.</p>`;
    speak("Not that country. Keep looking.", "en-US", 0.9);
    if (qz.lives <= 0) {
      qz.verdict = "no";
      qz.pulse = q.id;
      box.innerHTML = `<p>It was ${q.name}.</p>`;
      draw();
      setTimeout(nextQuestion, 1800);
    }
  }
}
function nextQuestion() {
  const qz = state.quiz;
  if (!qz) return;
  qz.index += 1; qz.verdict = null; qz.pulse = null;
  if (qz.index >= qz.questions.length || qz.lives <= 0 && qz.verdict !== "yes") {
    const box = document.getElementById("quiz");
    box.innerHTML = `<h3>Done</h3><p>Score ${qz.score} / ${qz.questions.length}</p><button class="btn" id="quizClose">Close</button>`;
    document.getElementById("quizClose").onclick = closeQuiz;
    state.quiz = { phase:"done" };
    draw();
    return;
  }
  showQuestion(); draw();
}
function closeQuiz() {
  state.quiz = null;
  document.getElementById("quiz").classList.add("hide");
  draw();
}

function boot() {
  const topo = WORLD;
  const obj = topo.objects.countries || topo.objects.land;
  const fc = topojson.feature(topo, obj);
  features = fc.features.map(f => {
    const raw = f.id != null ? String(f.id).padStart(3,"0") : null;
    return { ...f, id: raw };
  }).filter(f => f.id && f.id !== "010" && f.id !== "260");
  document.getElementById("quizBtn").style.display = "none";
  fillSelect();
  renderLegend();
  renderRail();
  renderPanel();
  renderTip();
  draw();
  window.addEventListener("resize", draw);
  if (window.speechSynthesis) speechSynthesis.getVoices();
}
boot();
</script>
